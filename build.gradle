import net.darkhax.curseforgegradle.TaskPublishCurseForge

plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'com.modrinth.minotaur' version '2.+'
	id 'net.darkhax.curseforgegradle' version '1.1.+'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven { url = 'https://jitpack.io' }

	// Needed to retrieve Cloth Config Lite for development environments.
	maven {
		name = "Shedaniel's Maven"
		url = "https://maven.shedaniel.me/"
	}

	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/releases/"
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	api("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
	implementation ("com.terraformersmc:modmenu:${project.modmenu_version}")
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}"}
	}
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

// Modrinth / Curseforge deployment
def tag = System.getenv("CI_COMMIT_TAG") ?: project.version.toString()

// Expects tags like: v1.4.0 or v1.4.0-beta
def tagMatch = tag =~ /^v?([\d.]+)(?:-(alpha|beta))?/
def modVersion  = tagMatch ? tagMatch.group(1) : tag
def releaseType = tagMatch ? (tagMatch.group(2) ?: "release") : "release"
def mcVersions = (project.findProperty("supported_minecraft_versions") as String).split(",")*.trim()

def changelogText = {
	def output = "git tag -l --format=%(contents) ${tag}".execute().text.trim()
	return output ?: "See commit history for ${tag}."
}()

modrinth {
	token = System.getenv("MODRINTH_TOKEN")
	projectId = "pz6Trz9Z"
	versionNumber = modVersion
	versionType = releaseType
	uploadFile = jar
	gameVersions = mcVersions
	loaders = ["fabric"]
	changelog = changelogText

	dependencies {
		required.project "fabric-api"
		required.project "cloth-config"
		optional.project "modmenu"
	}
}

tasks.register("curseforge", TaskPublishCurseForge) {
	apiToken = System.getenv("CURSEFORGE_TOKEN")
	disableVersionDetection()

	def mainFile = upload("610525", jar)
	mainFile.changelog = changelogText
	mainFile.releaseType = releaseType
	mainFile.addModLoader("Fabric")
	mainFile.addGameVersion("Client")
	mainFile.addGameVersion("Server")
	mainFile.addGameVersion(mcVersions.toArray())
}
